<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      animateTransform, animate { display: none; }
    }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .hero-hello { animation: fadeSlideIn 0.8s ease-out 0.2s both; }
    .hero-name  { animation: fadeSlideIn 0.8s ease-out 0.4s both; }
    .hero-title { animation: fadeSlideIn 0.8s ease-out 0.6s both; }
    .hero-chips { animation: fadeSlideIn 0.8s ease-out 0.8s both; }
    .cursor     { animation: cursorBlink 1s step-end infinite; }
  </style>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF">
      <animate attributeName="stop-color" values="#FFFFFF;#F0F4FA;#FFFFFF" dur="10s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#EEF4FB">
      <animate attributeName="stop-color" values="#EEF4FB;#E8DFFF;#EEF4FB" dur="10s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="ac1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891B2"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="rgba(0,0,0,0)" />
    <stop offset="0.5" stop-color="rgba(0,0,0,0.04)" />
    <stop offset="1" stop-color="rgba(0,0,0,0)" />
  </linearGradient>
  <clipPath id="chipsClip"><rect x="100" y="256" width="448" height="34" rx="17"/></clipPath>
</defs>

<!-- Background -->
<rect width="1200" height="320" rx="20" fill="url(#bg1)"/>

<!-- Floating orb 1 (violet) -->
<circle cx="1060" cy="60" r="150" fill="#7C3AED" opacity="0.07">
  <animateTransform attributeName="transform" type="translate" values="0,0; 15,10; 0,0" dur="8s" repeatCount="indefinite"/>
</circle>

<!-- Floating orb 2 (cyan) -->
<circle cx="120" cy="290" r="130" fill="#0891B2" opacity="0.07">
  <animateTransform attributeName="transform" type="translate" values="0,0; -12,8; 0,0" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- Floating orb 3 (emerald) -->
<circle cx="700" cy="160" r="80" fill="#059669" opacity="0.04">
  <animateTransform attributeName="transform" type="translate" values="0,0; 10,-8; 0,0" dur="12s" repeatCount="indefinite"/>
</circle>

<!-- Accent bar -->
<rect x="70" y="70" width="6" height="150" rx="3" fill="url(#ac1)"/>

<!-- HELLO text -->
<text class="hero-hello" x="100" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="4" fill="#475569">HELLO, I'M</text>

<!-- Name -->
<text class="hero-name" x="100" y="185" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#0F172A">Aakash Patil</text>

<!-- Title + cursor -->
<g class="hero-title">
  <text x="100" y="228" font-family="Consolas, 'Courier New', monospace" font-size="24" fill="url(#ac1)">Full Stack Java Developer  ·  Spring Boot  ·  React</text>
  <rect class="cursor" x="855" y="210" width="2" height="24" fill="#0891B2"/>
</g>

<!-- Skill chips -->
<g class="hero-chips" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0F172A">
  <rect x="100" y="256" width="150" height="34" rx="17" fill="#DDE7F5"/>
  <text x="175" y="278" text-anchor="middle">Microservices</text>
  <rect x="262" y="256" width="110" height="34" rx="17" fill="#DDE7F5"/>
  <text x="317" y="278" text-anchor="middle">AI + Cloud</text>
  <rect x="384" y="256" width="160" height="34" rx="17" fill="#DDE7F5"/>
  <text x="464" y="278" text-anchor="middle">1000+ DSA Solved</text>
  <rect x="0" y="256" width="200" height="34" fill="url(#shimmerGrad)" clip-path="url(#chipsClip)">
    <animateTransform attributeName="transform" type="translate" values="-200,0; 650,0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>