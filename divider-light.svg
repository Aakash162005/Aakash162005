<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" width="800" height="4">
<defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .pulse { display: none; }
    }
  </style>
  <linearGradient id="lline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#0891B2" stop-opacity="0.4"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lpulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
    <stop offset="0.4" stop-color="#7C3AED" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0" y="1" width="800" height="2" rx="1" fill="url(#lline)"/>
<rect class="pulse" x="0" y="0" width="120" height="4" rx="2" fill="url(#lpulse)">
  <animateTransform attributeName="transform" type="translate" values="-120,0; 800,0" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
